name: Build packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job widens `contents` to write so it
# can create the Release and upload assets. Without this the step fails with
# "Resource not accessible by integration".
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin the runner image: `ubuntu-latest` migrates to Ubuntu 26 in Oct 2026.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # --- ipk (OpenWrt / ImmortalWrt 23.05 and 24.10) -----------------------
      - name: Build ipk (both container formats)
        run: python3 tools/build_ipk.py

      - name: Verify ipk container layout
        run: |
          python3 - <<'EOF'
          import gzip, io, sys, tarfile, zlib
          from pathlib import Path

          for pkg in sorted(Path('build').glob('*.ipk')):
              blob = pkg.read_bytes()
              if blob.startswith(b'!<arch>'):
                  print(f'{pkg.name}: ar container ok')
                  continue
              payload = zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(blob)
              names = tarfile.open(fileobj=io.BytesIO(payload)).getnames()
              assert names == ['./debian-binary', './control.tar.gz', './data.tar.gz'], names
              print(f'{pkg.name}: gzip(tar) container ok -> {names}')
          EOF

      # --- apk (OpenWrt 25.x, apk-tools 3 / ADB v3 container) ----------------
      - name: Build apk (OpenWrt 25, ADB v3)
        run: python3 tools/build_apk.py -t v3

      - name: Verify apk container (ADBd + deflate)
        run: |
          python3 - <<'EOF'
          import zlib
          from pathlib import Path

          for pkg in sorted(Path('build').glob('*.apk')):
              blob = pkg.read_bytes()
              assert blob[:4] == b'ADBd', f'{pkg.name}: bad magic {blob[:4]!r}'
              inner = zlib.decompressobj(-15).decompress(blob[4:])
              assert inner[:4] == b'ADB.', f'{pkg.name}: bad container header'
              print(f'{pkg.name}: ADB v3 container ok ({len(blob)} bytes)')
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: luci-app-homeproxy-switch-packages
          path: |
            build/*.ipk
            build/*.apk
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.ipk
            build/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
